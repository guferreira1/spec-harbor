version: 1

templates:
  aliases:
    service-feature:
      source: remote
      url: https://example.com/specharbor/templates/service-feature.zip
      checksum: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      format: zip

project:
  name: spec-harbor
  default_language: en
  default_generation_mode: guided

openspec:
  root: openspec
  changes_dir: openspec/changes
  specs_dir: openspec/specs

agents:
  default: codex
  supported:
    - codex
    - claude-code
    - cursor
    - devin
    - github-copilot
    - gemini-cli
    - roo-code
    - windsurf
    - aider
    - generic

ai:
  provider: openai-compatible
  model: ""
  api_key_env: SPECHARBOR_AI_API_KEY
