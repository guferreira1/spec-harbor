version: 1

templates:
  aliases: {}

project:
  name: ""
  default_language: en
  default_generation_mode: guided

openspec:
  root: openspec
  changes_dir: openspec/changes
  specs_dir: openspec/specs

agents:
  default: codex
  supported:
    - codex
    - claude
    - cursor
    - devin
    - copilot
    - gemini
    - roo
    - windsurf
    - aider
    - generic

ai:
  provider: openai-compatible
  model: ""
  api_key_env: SPECHARBOR_AI_API_KEY
